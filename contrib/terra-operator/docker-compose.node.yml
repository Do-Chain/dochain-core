version: '3.8'

services:
   node:
     container_name: node
     image: public.ecr.aws/classic-do/node:alpine3.17
     platform: linux/amd64
     environment:
       - CHAINID=test
       - NEW_NETWORK=true
       - ENABLE_LCD=true
       - DOCHAIND_STARTUP_PARAMETERS=--x-crisis-skip-assert-invariants
       - MINIMUM_GAS_PRICES=0.05udo,0.104938usdr,0.15uusd,170.0ukrw
       - MONIKER=rebel-docker-node
       - VALIDATOR_KEYNAME=local
       - VALIDATOR_PASSPHRASE=${VALIDATOR_PASSPHRASE:-}
       - VALIDATOR_MNENOMIC=${VALIDATOR_MNENOMIC:-}
       - VALIDATOR_AMOUNT=10000000udo
       - VALIDATOR_COMMISSION_RATE=0.1
       - VALIDATOR_COMMISSION_RATE_MAX=0.2
       - VALIDATOR_COMMISSION_RATE_MAX_CHANGE=0.01
       - VALIDATOR_MIN_SELF_DELEGATION=1
       - VALIDATOR_GAS=auto
       - VALIDATOR_GAS_ADJUSTMENT=1.4
       - VALIDATOR_FEES=120000udo
       #Do not make 1 if you don’t know EXACTLY what you are doing 
       - VALIDATOR_AUTO_CONFIG=0
     restart: always
     ports:     
       - "127.0.0.1:1317:1317"
       - "127.0.0.1:9090:9090"
       - "26656:26656"
       - "127.0.0.1:26657:26657"
     volumes:
       - do:/do       
     networks:
       - do-classic
     ulimits:
        nproc: 65535
        nofile:
          soft: 65535
          hard: 65535
volumes:
  do:

networks:
  do-classic:
    driver: bridge





