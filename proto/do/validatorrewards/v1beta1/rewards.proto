syntax = "proto3";
package do.validatorrewards.v1beta1;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/Daviddochain/dochain-core/v4/x/validatorrewards/types";

// RewardDenom records the wallet or governance address allowed to create
// validator reward campaigns for a bank denom.
message RewardDenom {
  string denom = 1;
  string admin = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// ValidatorAllocation stores one validator's campaign allocation and released
// amount.
message ValidatorAllocation {
  string validator_address = 1 [(cosmos_proto.scalar) = "cosmos.ValidatorAddressString"];
  cosmos.base.v1beta1.Coin amount = 2 [(gogoproto.nullable) = false];
  string released = 3;
}

// Campaign stores a funded validator-delegator reward campaign.
message Campaign {
  uint64 id = 1;
  string admin = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string denom = 3;
  string title = 4;
  string description = 5;
  repeated ValidatorAllocation allocations = 6 [(gogoproto.nullable) = false];
  int64 start_height = 7;
  int64 end_height = 8;
  bool delegators_only = 9;
  bool cancelled = 10;
}
